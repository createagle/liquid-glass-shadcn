name: 组件回归（行为 + 视觉）

# behavior 与 visual 两个 project 都跑，各占一个 job。
#
# visual 曾经**刻意不跑**：截图快照是平台相关的（Windows 与 Linux CI 的
# blur 渲染已实测不一致，见 STATUS §0.5），本机录的基线在 CI 上必然全红。
# 2026-09-05 用 visual-baseline.yml 在 ubuntu-24.04 上录了一套 *-linux.png
# （Playwright 按平台加后缀，两套基线共存互不干扰），
# 并用 verify 模式独立跑过一遍确认可复现，这才接进来。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 刻意不写 version —— package.json 的 packageManager 是唯一事实来源
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 与 contrast.yml 对齐；脚本里有直接 import .ts 的地方
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 静态规则，秒级失败 —— 抓的是「本机 typecheck 看不出来、
      # 装到别人工程里才炸」的那类问题，不用等冒烟测试跑完
      - name: registry 组件静态检查
        run: node scripts/registry-lint.mjs

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      # 验证台是 esbuild + Tailwind 产物，不入库，CI 里现构建
      - name: 构建验证台
        run: |
          pnpm --filter www dev:css
          pnpm --filter www dev:build

      # console.behavior.spec.ts 也在这个 project 里 —— 它盯的是
      # 「功能正常但实现在空转」那一类问题（Tabs 曾经无限重渲染，
      #   几何和像素都对，只有控制台在刷屏）。
      - name: 行为与几何回归
        run: npx playwright test --project=behavior

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 视觉回归。**与 behavior 分开一个 job**，这样红的时候一眼能看出是
  # 「几何/语义坏了」还是「像素变了」——两者的处理方式完全不同。
  #
  # ⚠️ runner 写死 ubuntu-24.04，不能用 ubuntu-latest：
  #    快照是按平台录的（`*-linux.png`），镜像一升级、字体或光栅一变，
  #    286 张会集体变红，而那种红没有任何信息量。
  #    要升镜像就用 visual-baseline.yml 的 record 模式重录一次，
  #    那是一次有意识的动作，不该由 GitHub 替我们决定。
  #
  # 基线怎么来的、怎么重录：见 .github/workflows/visual-baseline.yml。
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 浏览器版本跟着 lockfile 走 —— 浏览器一换渲染就变，基线也就作废了
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 构建验证台
        run: |
          pnpm --filter www dev:css
          pnpm --filter www dev:build

      - name: 视觉回归（Linux 基线）
        run: npx playwright test --project=visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7
