name: WCAG AA 对比度审计

# PROJECT_SPEC §13：
#   「所有文本在材质档位 0（最通透）+ 最不利背景下仍需满足 WCAG AA
#     （正文 4.5:1，大字 3:1）…… 写一个自动化检查脚本，在 CI 里对每个组件的
#     截图做采样检测，不通过就 fail。」
#
# 检查真的去渲染、真的截图、真的读像素 —— 玻璃的有效背景是
# backdrop-filter 合成出来的，光按 CSS 变量算不出人眼看到的那个颜色。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 刻意**不写 version** —— package.json 的 packageManager 字段是唯一事实来源。
      # 两处都写会让 action 直接报 "Multiple versions of pnpm specified" 并失败。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24：contrast-audit.mjs / derived-colors.mjs 直接 import .ts 源
          # （靠原生类型剥离），backdrop-probe-test.mjs 用 stripTypeScriptTypes。
          # 22.x 要靠 backport 才有，别退。
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      # 派生 token 必须与推导逻辑一致 —— 字面值漂了不会有任何报错，
      # 所以单独钉一道。
      - name: 校验 --lg-on-glass-* 未漂移
        run: node scripts/derived-colors.mjs

      # 探针的两条契约：该省时省、测不出时回落。
      # 后者尤其要盯 —— 探针若在测不出时给乐观结果，AA 保证会被静默破坏。
      - name: 背景探针行为测试
        run: node scripts/backdrop-probe-test.mjs

      - name: 跑对比度审计（棘轮基线：只许变好）
        run: node scripts/contrast-audit.mjs --verbose

      # 静止态的审计查不出「某个交互态把材质不透明度变成 0」——
      # Button 的按下升级为 Layer I 就踩过这个坑（条纹背景上 15.46 → 1.92）。
      # 这一步专门量交互态，且必须在高频背景上量：平滑背景上完全看不出问题。
      - name: 构建验证台
        run: |
          pnpm --filter www dev:css
          pnpm --filter www dev:build

      - name: 交互态可读性
        run: node scripts/press-legibility.mjs

      # 基线是「不许更糟」，不是豁免。若哪次改动把某个测点修到达标了，
      # 这一步会提示需要收紧棘轮 —— 收紧动作要人工做（跑 --update-baseline 并提交），
      # 避免 CI 自动放宽或自动收紧掩盖真实变化。
      - name: 提示基线是否需要收紧
        if: always()
        run: |
          echo "若日志里出现「记得跑 --update-baseline 收紧棘轮」，"
          echo "请在本地执行 node scripts/contrast-audit.mjs --update-baseline 并提交基线变更。"
