name: 部署文档站到 GitHub Pages

# 站点 = 文档站 + registry 产物。两者一起发出去是刻意的：
# `/r/*.json` 就是用户在 components.json 里填的那个地址
# （见 apps/www/app/(site)/docs/installation/page.tsx 第 3 步）。
#
# ⚠️ 但**端到端安装现在还走不通**：每个组件都把 @glass/core 写在 dependencies 里，
# 而那个包还没发到 npm，`shadcn add` 会在装依赖那一步失败。
# 部署解决的是「registry 取不到」，没解决「依赖装不上」。安装页里如实写了。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一次部署。**不取消进行中的那次** —— 取消到一半会留下半个站。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # 项目页挂在 /<repo>/ 下，不是域名根
      NEXT_PUBLIC_BASE_PATH: /liquid-glass-shadcn
      NEXT_OUTPUT_EXPORT: '1'

    steps:
      - uses: actions/checkout@v4

      # 刻意不写 version —— package.json 的 packageManager 是唯一事实来源
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 与其余三条 workflow 对齐
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 这一步会跑 core:build + gen（示例 / API / Fidelity），再 next build。
      # `output: 'export'` 由上面的环境变量打开，产物落在 apps/www/out。
      # public/ 会被原样拷进去 —— registry 产物（public/r/*.json）就是这么上线的，
      # 它们已经入库，且 scripts/registry-lint.mjs 逐字核对过新鲜度。
      - name: 构建并导出静态站点
        run: pnpm --filter www build

      # basePath 只管 <Link> 和 Next 自己的资源。裸 <a> / <img> / window.open
      # 一个都不带前缀，而且**本地怎么测都测不出来**（本地 basePath 是空的）。
      # 这一步扫产物里的 href/src，发现没带前缀的站内绝对路径就 fail。
      # 它第一次跑就抓到了 8 张 Fidelity 对照图（16 处）。
      - name: 检查导出产物的站内绝对路径
        run: node scripts/check-export-links.mjs apps/www/out "$NEXT_PUBLIC_BASE_PATH"

      # ⚠️ GitHub Pages 默认过一遍 Jekyll，而 Jekyll **会丢掉所有 `_` 开头的目录**。
      # Next 的静态资源全在 `_next/` 下面 —— 少了这个空文件，整站没样式没脚本。
      - name: 关掉 Jekyll
        run: touch apps/www/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/www/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 部署成功 ≠ 站点是活的。构建期那两道闸看的都是**磁盘上的文件**，
  # 而托管层有自己的坑：Pages 默认过 Jekyll 会丢掉 _next/，
  # 那时候 HTML 照样 200、页面照样返回，只是没样式也没脚本。
  # 这个 job 只测本地测不出来的那部分，不重复构建期已经查过的东西。
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 线上冒烟检查
        run: node scripts/smoke-pages.mjs "${{ needs.deploy.outputs.page_url }}"
