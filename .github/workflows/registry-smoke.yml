name: Registry 安装冒烟测试

# PROJECT_SPEC §11.2：
#   「CI 必须包含 registry.json schema 校验 + 对每个 item 做真实安装冒烟测试
#     （在临时的干净 Next.js 工程里 add 并构建通过）。没有跑通这个测试就不算完成。」
#
# 本 job 覆盖两种安装方式：直链 与 命名空间。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # 刻意**不写 version** —— package.json 的 packageManager 字段是唯一事实来源。
      # 两处都写会让 action 直接报 "Multiple versions of pnpm specified" 并失败。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 与 contrast.yml 对齐，也与本地开发一致
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建 @createagle/glass-core
        run: |
          cd packages/glass-core
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.json

      # ── registry ────────────────────────────────────────────────────
      - name: 生成 theme item（从 CSS 源单向生成）
        run: cd apps/www && node scripts/generate-theme-item.mjs

      - name: 确认生成物与源同步（CI 里不允许有未提交的漂移）
        run: |
          if [ -n "$(git status --porcelain apps/www/registry/glass/registry.json)" ]; then
            echo "::error::registry/glass/registry.json 与 CSS 源不同步。"
            echo "请在本地跑 'node apps/www/scripts/generate-theme-item.mjs' 并提交结果。"
            git --no-pager diff -- apps/www/registry/glass/registry.json
            exit 1
          fi

      - name: 校验 registry schema
        run: cd apps/www && npx --yes shadcn@latest registry validate registry.json

      - name: 构建 registry
        run: cd apps/www && npx --yes shadcn@latest build

      # public/r/*.json 里装的是**组件源码的副本** —— 用户 shadcn add 拿到的就是它。
      # 上面那道闸只看 registry/glass/registry.json，漏掉了这一层：
      # 改了 .tsx 但忘了重新 build，仓库里挂着的就是旧源码，而且不会有任何报错。
      # （已经发生过一次：dialog.tsx 改了注释，public/r/dialog.json 停在旧版。）
      - name: 确认 public/r 与组件源同步
        run: |
          if [ -n "$(git status --porcelain apps/www/public/r)" ]; then
            echo "::error::public/r/*.json 与组件源码不同步。"
            echo "请在本地跑 'pnpm --filter www registry:build' 并提交结果。"
            git --no-pager diff --stat -- apps/www/public/r
            exit 1
          fi

      - name: 起 registry 静态服务（:4180）
        run: |
          cd apps/www && node scripts/serve-registry.mjs 4180 &
          npx --yes wait-on http://localhost:4180/r/registry.json -t 30000

      # ── @createagle/glass-core 尚未发布到 npm，用本地 shim 覆盖真实依赖安装路径 ──
      - name: 打包 @createagle/glass-core 并起 npm shim（:4181）
        run: |
          cd packages/glass-core
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$GITHUB_WORKSPACE"
          node scripts/npm-registry-shim.mjs "$RUNNER_TEMP"/glass-core-*.tgz 4181 &
          npx --yes wait-on http://localhost:4181/@createagle/glass-core -t 30000

      # ── 干净工程 ────────────────────────────────────────────────────
      - name: 创建干净的 Next.js 工程
        run: |
          cd "$RUNNER_TEMP"
          npx --yes create-next-app@latest smoke \
            --typescript --tailwind --eslint --app --src-dir \
            --import-alias "@/*" --use-npm --no-turbopack --yes

      - name: shadcn init
        run: cd "$RUNNER_TEMP/smoke" && npx --yes shadcn@latest init -d --no-monorepo -f

      # ⚠️ 这两个 @ 前缀是**两套互不相干的东西**，别看着像就合并：
      #   @createagle  —— npm 的 scope，决定 `npm install` 去哪个 registry 取包
      #   @glass       —— shadcn 的 registry **命名空间**，只是 components.json
      #                   里的一个 key，映射到一个 URL 模板，与 npm 无关
      # 包名从 @glass/core 改成 @createagle/glass-core 时（npm 上 @glass 拿不到），
      # 只该动上面那一行；下面那个命名空间保持 @glass 不变。
      - name: 配置 shadcn 命名空间与 scoped npm registry
        run: |
          cd "$RUNNER_TEMP/smoke"
          echo "@createagle:registry=http://localhost:4181" > .npmrc
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('components.json','utf8'));
            j.registries={'@glass':'http://localhost:4180/r/{name}.json'};
            fs.writeFileSync('components.json', JSON.stringify(j,null,2));
          "

      - name: 方式一 · 直链安装
        run: |
          cd "$RUNNER_TEMP/smoke"
          npx --yes shadcn@latest add http://localhost:4180/r/utils.json --yes --overwrite

      - name: 方式二 · 命名空间安装（含 registryDependencies 传递解析）
        run: |
          cd "$RUNNER_TEMP/smoke"
          npx --yes shadcn@latest add @glass/glass-providers --yes --overwrite

      # 组件 item：验证 registryDependencies 能把 utils/theme 一并带进来，
      # 且组件源码里的 @/lib/utils 引用在目标工程里能解析
      - name: 方式三 · 安装 UI 组件（tabs / slider / switch / button / dialog / toggle / card / sheet / popover / responsive-overlay / dropdown-menu / select / checkbox / radio-group / collapsible / accordion / scroll-area / table / pagination / breadcrumb / context-menu / resizable）
        run: |
          cd "$RUNNER_TEMP/smoke"
          npx --yes shadcn@latest add @glass/tabs @glass/slider @glass/switch @glass/button @glass/dialog @glass/toggle @glass/card @glass/sheet @glass/popover @glass/responsive-overlay @glass/dropdown-menu @glass/select @glass/checkbox @glass/radio-group @glass/collapsible @glass/accordion @glass/scroll-area @glass/table @glass/pagination @glass/breadcrumb @glass/context-menu @glass/resizable --yes --overwrite

      - name: 断言 token 真的被注入（不需要手动补 CSS）
        run: |
          cd "$RUNNER_TEMP/smoke"
          css=src/app/globals.css
          for token in lg-refract-2 lg-label-primary lg-material-base lg-content-thick lg-card-fill lg-list-separator lg-radius-card lg-grabber-fill lg-glow lg-toggle-fill lg-disclosure-fill lg-scrollbar-thumb lg-selection-fill; do
            grep -q -- "--$token:" "$css" || { echo "::error::缺少 --$token"; exit 1; }
          done
          # --lg-glow 是 elevated 面板 box-shadow 列表里的最后一项。
          # 写成 `none` 时**整条 box-shadow 声明都会失效**（none 在逗号列表里非法），
          # 亮色下所有浮层面板就既没描边也没落影 —— 而且不会有任何报错。
          # 已经发生过一次，做 Select 时才发现，所以在这里钉一道闸。
          grep -q -- "--lg-glow: *none" "$css" && { echo "::error::--lg-glow 不能是 none"; exit 1; }
          grep -q "lg-surface" "$css" || { echo "::error::缺少 .lg-surface 渲染路径"; exit 1; }
          test -f src/components/glass-providers.tsx || { echo "::error::组件文件未落地"; exit 1; }
          for c in tabs slider switch button dialog toggle card sheet popover responsive-overlay dropdown-menu select checkbox radio-group collapsible accordion scroll-area table pagination breadcrumb context-menu resizable; do
            test -f "src/components/ui/$c.tsx" || { echo "::error::$c 组件未落地"; exit 1; }
          done
          test -f src/lib/utils.ts || { echo "::error::registryDependencies 没把 utils 带进来"; exit 1; }
          echo "✓ token、渲染路径与组件文件均已就位"

      - name: 目标工程构建通过
        run: cd "$RUNNER_TEMP/smoke" && npm run build
