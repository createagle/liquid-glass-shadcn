<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>结构件验证台</title>
<link rel="stylesheet" href="./tailwind.css">
<link rel="stylesheet" href="../../../packages/glass-core/src/tokens/theme.css">
<style>
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #bg{position:fixed;inset:0;
    background:var(--lg-grouped-bg)}
  #bg[data-bg="gradient"]{background:
      radial-gradient(40% 55% at 12% 18%,#ff2d55 0,transparent 60%),
      radial-gradient(45% 60% at 84% 14%,#ffcc00 0,transparent 60%),
      radial-gradient(55% 50% at 78% 86%,#001133 0,transparent 62%),
      linear-gradient(115deg,#000 0,#fff 35%,#0a84ff 70%,#000 100%)}
  #bg[data-bg="stripes"]{background:repeating-linear-gradient(90deg,#000 0 6px,#fff 6px 12px)}
  #root{position:relative;padding:28px;display:inline-block;color:var(--lg-label-primary)}
</style></head>
<body><div id="bg"></div><div id="root"></div>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get('bg')) document.getElementById('bg').dataset.bg = p.get('bg');
</script>
<script src="./structure-demo.js"></script></body></html>
