<!doctype html>
<html lang="zh-CN" data-glass-tier="a" data-glass-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@glass/core 光学调试台</title>
<link rel="stylesheet" href="../src/tokens/theme.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       background:#0b0c12;color:#e9e9ef;display:grid;grid-template-columns:1fr 330px;
       min-height:100vh}
  @media (max-width:900px){body{grid-template-columns:1fr}}

  /* ── 舞台：高对比度彩色「照片」+ 小字号文本 ───────────────────────── */
  #stage{position:relative;overflow:hidden;display:grid;place-items:center;padding:40px}
  #photo{position:absolute;inset:0;
    background:
      radial-gradient(60% 80% at 12% 18%, #ff2d55 0%, transparent 55%),
      radial-gradient(50% 70% at 82% 12%, #ffcc00 0%, transparent 55%),
      radial-gradient(70% 60% at 78% 82%, #0a84ff 0%, transparent 60%),
      radial-gradient(55% 65% at 22% 85%, #30d158 0%, transparent 58%),
      conic-gradient(from 210deg at 50% 50%, #af52de, #0a84ff, #30d158, #ffcc00, #ff2d55, #af52de);
    filter:saturate(1.25) contrast(1.05)}
  #photo.stripes{background:repeating-linear-gradient(115deg,
      #ff2d55 0 30px,#ffcc00 30px 60px,#30d158 60px 90px,#0a84ff 90px 120px,#af52de 120px 150px);
    filter:none}
  #photo.mono{background:#6e6e78;filter:none}
  #copytext{position:absolute;inset:0;padding:26px 18px;font-size:11px;line-height:1.35;
    color:#fff;text-shadow:0 1px 2px rgb(0 0 0 / .55);pointer-events:none;
    letter-spacing:.15px;opacity:.95}

  /* ── 被测对象 ─────────────────────────────────────────────────────── */
  #rig{position:relative;z-index:2;display:flex;flex-direction:column;gap:26px;align-items:center}
  .segmented{display:flex;gap:4px;padding:7px}
  .seg{padding:11px 26px;font-weight:600;font-size:15px;color:#fff;
       text-shadow:0 1px 1px rgb(0 0 0 / .4);border-radius:19px;cursor:pointer;user-select:none}
  #knobRow{display:flex;align-items:center;gap:20px}
  #knob{width:74px;height:74px;cursor:grab}
  #knob:active{cursor:grabbing}
  .hint{font-size:12px;color:#fff;text-shadow:0 1px 3px #000;opacity:.85}

  /* ── 控制面板 ─────────────────────────────────────────────────────── */
  #panel{background:#14151d;border-left:1px solid #262735;padding:16px 16px 60px;
         overflow-y:auto;max-height:100vh}
  h1{font-size:15px;margin:0 0 2px}
  .sub{font-size:12px;color:#8f8fa6;margin:0 0 14px}
  fieldset{border:1px solid #262735;border-radius:10px;padding:10px 12px 12px;margin:0 0 12px}
  legend{font-size:12px;font-weight:700;color:#a9a9c2;padding:0 5px}
  .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;margin:7px 0 2px}
  .row label{font-size:12.5px;color:#c9c9dc}
  .row output{font:12px ui-monospace,Consolas,monospace;color:#7ee0a8;min-width:52px;text-align:right}
  input[type=range]{width:100%;accent-color:#0a84ff}
  .seg-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .seg-btns button{flex:1;min-width:52px;background:#1e1f2b;color:#c9c9dc;border:1px solid #2f3040;
    padding:6px 8px;border-radius:7px;font-size:12px;cursor:pointer}
  .seg-btns button[aria-pressed=true]{background:#0a84ff;color:#fff;border-color:#0a84ff}
  #out{width:100%;height:150px;background:#0a0b10;color:#7ee0a8;border:1px solid #262735;
       border-radius:8px;padding:9px;font:11.5px/1.5 ui-monospace,Consolas,monospace;margin-top:8px}
  .warn{font-size:11.5px;color:#ffb27a;margin:6px 0 0;line-height:1.45}
  button.act{width:100%;background:#0a84ff;color:#fff;border:0;padding:9px;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
</style>
</head>
<body>

<div id="stage">
  <div id="photo"></div>
  <div id="copytext"></div>
  <div id="rig">
    <div class="lg-surface segmented" data-layer="base" id="base" style="--lg-surface-radius:26px">
      <div class="lg-surface seg" data-layer="indicator" id="ind">Refracted</div>
      <div class="seg">Plain</div>
      <div class="seg">Plain</div>
    </div>
    <div id="knobRow">
      <span class="hint">按住拖动 →</span>
      <div class="lg-surface" data-layer="indicator" id="knob" style="--lg-surface-radius:37px"></div>
      <span class="hint">← 观察交互态增强</span>
    </div>
  </div>
</div>

<div id="panel">
  <h1>@glass/core 光学调试台</h1>
  <p class="sub">Phase 1 视觉标定用。所有滤镜参数均可拖拽。</p>

  <fieldset>
    <legend>渲染档位</legend>
    <div class="seg-btns" id="tierBtns">
      <button data-tier="a" aria-pressed="true">Tier A</button>
      <button data-tier="b" aria-pressed="false">Tier B</button>
      <button data-tier="c" aria-pressed="false">Tier C</button>
    </div>
    <p class="warn" id="tierNote"></p>
  </fieldset>

  <fieldset>
    <legend>主题 / 材质档位</legend>
    <div class="seg-btns" id="themeBtns">
      <button data-theme="light" aria-pressed="false">Light</button>
      <button data-theme="dark" aria-pressed="true">Dark</button>
    </div>
    <div class="row"><label for="tint">材质档位 tint</label><output id="tintOut"></output></div>
    <input type="range" id="tint" min="0" max="1" step="0.01" value="0.34">
    <p class="warn">档位只影响 Layer B 底座，不影响指示器折射强度（PROJECT_SPEC §8）。</p>
  </fieldset>

  <fieldset>
    <legend>背景</legend>
    <div class="seg-btns" id="bgBtns">
      <button data-bg="photo" aria-pressed="true">彩色照片</button>
      <button data-bg="stripes" aria-pressed="false">高频条纹</button>
      <button data-bg="mono" aria-pressed="false">纯灰</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>折射与色散</legend>
    <div class="row"><label for="distortionScale">distortionScale 折射强度</label><output id="distortionScaleOut"></output></div>
    <input type="range" id="distortionScale" min="-400" max="0" step="5" value="-180">

    <div class="row"><label for="redOffset">redOffset</label><output id="redOffsetOut"></output></div>
    <input type="range" id="redOffset" min="-60" max="60" step="1" value="0">

    <div class="row"><label for="greenOffset">greenOffset</label><output id="greenOffsetOut"></output></div>
    <input type="range" id="greenOffset" min="-60" max="80" step="1" value="18">

    <div class="row"><label for="blueOffset">blueOffset</label><output id="blueOffsetOut"></output></div>
    <input type="range" id="blueOffset" min="-60" max="80" step="1" value="38">

    <div class="row"><label for="postBlur">postBlur 合成柔化</label><output id="postBlurOut"></output></div>
    <input type="range" id="postBlur" min="0" max="3" step="0.05" value="0.3">
    <p class="warn">三通道 scale 的**差值**就是色散强度。差值为 0 时没有彩边。</p>
  </fieldset>

  <fieldset>
    <legend>位移贴图</legend>
    <div class="row"><label for="borderWidth">borderWidth 透镜带宽</label><output id="borderWidthOut"></output></div>
    <input type="range" id="borderWidth" min="0.01" max="0.5" step="0.005" value="0.18">

    <div class="row"><label for="brightness">brightness 中心灰度</label><output id="brightnessOut"></output></div>
    <input type="range" id="brightness" min="0" max="100" step="1" value="50">

    <div class="row"><label for="opacity">opacity 中心归零强度</label><output id="opacityOut"></output></div>
    <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.93">

    <div class="row"><label for="blur">blur 中心块模糊</label><output id="blurOut"></output></div>
    <input type="range" id="blur" min="0" max="40" step="0.5" value="6">

    <div class="row"><label for="radius">radius 圆角</label><output id="radiusOut"></output></div>
    <input type="range" id="radius" min="0" max="40" step="1" value="19">

    <div class="row"><label for="xChannel">采样通道 X / Y</label><output id="chOut"></output></div>
    <div class="seg-btns" id="chBtns">
      <button data-ch="R|B" aria-pressed="true">R / B</button>
      <button data-ch="R|G" aria-pressed="false">R / G</button>
      <button data-ch="B|R" aria-pressed="false">B / R</button>
    </div>
    <p class="warn">默认 R/B。上游 React Bits 默认的 R/G 会让纵向位移退化 —— 绿通道里没有垂直梯度。</p>
  </fieldset>

  <fieldset>
    <legend>贴图预览 / 当前参数</legend>
    <img id="mapPreview" alt="位移贴图" style="width:100%;border-radius:8px;border:1px solid #262735;background:#000">
    <textarea id="out" readonly></textarea>
    <button class="act" id="copy">复制参数（贴回 optics-web.md）</button>
    <button class="act" id="reset" style="background:#2f3040">恢复默认</button>
  </fieldset>
</div>

<script src="./glass-optics.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const root = document.documentElement;

$('copytext').textContent =
  ('LEGIBILITY PROBE 0123456789 the quick brown fox jumps over the lazy dog. ').repeat(160);

const NUM = ['distortionScale','redOffset','greenOffset','blueOffset','postBlur',
             'borderWidth','brightness','opacity','blur','radius'];
const DEFAULTS = {distortionScale:-180,redOffset:0,greenOffset:18,blueOffset:38,postBlur:0.3,
                  borderWidth:0.18,brightness:50,opacity:0.93,blur:6,radius:19,
                  xChannel:'R',yChannel:'B',tint:0.34};

let state = {...DEFAULTS};
let held = {ind:null, knob:null};   // 已 acquire 的参数，用于 release

function paramsFor(el){
  const r = el.getBoundingClientRect();
  return {
    width: Math.max(1, Math.round(r.width)),
    height: Math.max(1, Math.round(r.height)),
    radius: state.radius,
    borderWidth: state.borderWidth,
    brightness: state.brightness,
    opacity: state.opacity,
    blur: state.blur,
    distortionScale: state.distortionScale,
    redOffset: state.redOffset,
    greenOffset: state.greenOffset,
    blueOffset: state.blueOffset,
    xChannel: state.xChannel,
    yChannel: state.yChannel,
    postBlur: state.postBlur,
  };
}

function applyTo(key, el, pressed){
  if (root.getAttribute('data-glass-tier') !== 'a'){
    if (held[key]) { GlassOptics.releaseFilter(held[key]); held[key] = null; }
    el.style.backdropFilter = ''; el.style.webkitBackdropFilter = '';
    return;
  }
  const p = paramsFor(el);
  if (held[key]) GlassOptics.releaseFilter(held[key]);
  const id = GlassOptics.acquireFilter(p);
  held[key] = p;
  const boost = pressed ? 'brightness(1.12) saturate(1.4)' : 'brightness(1.06) saturate(1.22)';
  el.style.backdropFilter = `url(#${id}) ${boost}`;
  el.style.webkitBackdropFilter = `url(#${id}) ${boost}`;
}

function render(){
  for (const k of NUM){
    $(k).value = state[k];
    $(k + 'Out').textContent = state[k];
  }
  $('tint').value = state.tint;
  $('tintOut').textContent = state.tint;
  $('chOut').textContent = state.xChannel + ' / ' + state.yChannel;
  root.style.setProperty('--lg-tint', state.tint);

  // 材质档位插值（与 GlassProvider 的 resolveMaterial 同一张表）
  const dark = root.getAttribute('data-glass-theme') === 'dark';
  const stops = dark
    ? [[0.22,8,1.8,0.6],[0.44,14,1.6,1.0],[0.62,20,1.3,1.35],[0.94,26,1.0,1.7]]
    : [[0.34,8,1.9,0.5],[0.62,14,1.7,1.0],[0.78,20,1.35,1.3],[0.96,26,1.05,1.6]];
  const pos = Math.min(1, Math.max(0, state.tint)) * 3;
  const i = Math.min(2, Math.floor(pos)), t = pos - i;
  const lerp = (a,b) => a + (b-a)*t;
  root.style.setProperty('--lg-base-alpha', lerp(stops[i][0], stops[i+1][0]).toFixed(4));
  root.style.setProperty('--lg-base-blur',  lerp(stops[i][1], stops[i+1][1]).toFixed(2) + 'px');
  root.style.setProperty('--lg-base-saturate', lerp(stops[i][2], stops[i+1][2]).toFixed(3));
  root.style.setProperty('--lg-stroke-strength', lerp(stops[i][3], stops[i+1][3]).toFixed(3));

  $('ind').style.setProperty('--lg-surface-radius', state.radius + 'px');

  applyTo('ind', $('ind'), $('ind').dataset.pressed === 'true');
  applyTo('knob', $('knob'), $('knob').dataset.pressed === 'true');

  const map = GlassOptics.createDisplacementMap(paramsFor($('ind')));
  $('mapPreview').src = map.href;

  $('out').value =
`# @glass/core 标定参数  ${new Date().toISOString().slice(0,19)}
tier      = ${root.getAttribute('data-glass-tier')}
theme     = ${root.getAttribute('data-glass-theme')}
tint      = ${state.tint}

--lg-refract  distortionScale = ${state.distortionScale}
--lg-disperse redOffset/greenOffset/blueOffset = ${state.redOffset} / ${state.greenOffset} / ${state.blueOffset}
              postBlur = ${state.postBlur}

贴图  borderWidth=${state.borderWidth}  brightness=${state.brightness}
      opacity=${state.opacity}  blur=${state.blur}  radius=${state.radius}
采样  x=${state.xChannel}  y=${state.yChannel}

活跃折射实例 = ${GlassOptics.activeFilterCount()}
UA = ${navigator.userAgent}`;
}

for (const k of NUM){
  $(k).addEventListener('input', (e) => {
    state[k] = parseFloat(e.target.value);
    render();
  });
}
$('tint').addEventListener('input', (e) => { state.tint = parseFloat(e.target.value); render(); });

function bindSeg(containerId, attr, fn){
  $(containerId).addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    [...$(containerId).querySelectorAll('button')]
      .forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    fn(btn.dataset[attr]);
    render();
  });
}
bindSeg('tierBtns','tier', v => {
  root.setAttribute('data-glass-tier', v);
  $('tierNote').textContent = {
    a:'完整方案：SVG feDisplacementMap 折射 + R/G/B 三通道色散。',
    b:'无真折射：多层 inset 阴影模拟透镜 + 渐变边框模拟色散彩边。应当仍是完整设计。',
    c:'无 backdrop-filter：半透明纯色 + 描边 + 渐变高光。结构与可读性必须完全正确。'
  }[v];
});
bindSeg('themeBtns','theme', v => {
  root.setAttribute('data-glass-theme', v);
  root.classList.toggle('dark', v === 'dark');
});
bindSeg('bgBtns','bg', v => { $('photo').className = v === 'photo' ? '' : v; });
bindSeg('chBtns','ch', v => { const [x,y] = v.split('|'); state.xChannel = x; state.yChannel = y; });

// 交互态：按下时折射 / 高光同时上扬
for (const el of [$('ind'), $('knob')]){
  el.addEventListener('pointerdown', () => { el.dataset.pressed = 'true'; render(); });
}
addEventListener('pointerup',    () => { for (const el of [$('ind'),$('knob')]) delete el.dataset.pressed; render(); });
addEventListener('pointercancel',() => { for (const el of [$('ind'),$('knob')]) delete el.dataset.pressed; render(); });

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('out').value); $('copy').textContent = '已复制 ✓'; }
  catch { $('out').select(); }
});
$('reset').addEventListener('click', () => { state = {...DEFAULTS}; render(); });

// 首帧：报告真实检测到的 tier，但仍默认展示 Tier A 以便标定
const detected = GlassOptics.detectTierSync();
$('tierNote').textContent = `本浏览器自动检测为 Tier ${detected.toUpperCase()}。完整方案：SVG 折射 + 三通道色散。`;
GlassOptics.probeFeImage().then(ok => {
  if (!ok) $('tierNote').textContent +=
    ' ⚠️ feImage 运行时探针未通过 —— 折射可能不会生效。';
});

new ResizeObserver(() => render()).observe($('ind'));
render();
</script>
</body>
</html>
