packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10+ 默认不跑依赖的构建脚本；不显式放行的话，
# pnpm 11 的 `install` 会以 ERR_PNPM_IGNORED_BUILDS 直接失败（不是警告）。
#
# 这两个都需要构建脚本：
#   esbuild          下载对应平台的原生二进制
#   @parcel/watcher  编译原生文件监听（Next.js 开发服务器的传递依赖）
allowBuilds:
  esbuild: true
  '@parcel/watcher': true

# shadcn CLI 的传递依赖 @modelcontextprotocol/sdk 要求 zod ^3.25.28，
# 但工作区里被解析成了 3.24.1（peer 冲突），CLI 一启动就报
# ERR_PACKAGE_PATH_NOT_EXPORTED: './v3'。
# CI 用的是 `npx shadcn@latest`（独立解析），不受影响；这条只为修本地。
overrides:
  zod: ^3.25.76
